name: XGuardian SAST Accuracy Benchmark

on:
  workflow_dispatch:
    inputs:
      xguardian_environment:
        description: "XGuardian target environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - production
  push:
    branches:
      - main
    paths:
      - "cases/**"
      - "benchmark_meta/ground_truth.json"
      - "benchmark_meta/ground_truth.csv"
      - ".github/workflows/xguardian-sast.yml"

permissions:
  contents: read

concurrency:
  group: xguardian-sast-accuracy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sast-accuracy-scan:
    # Push execution is opt-in to avoid accidental scan cost before repository setup.
    if: github.event_name == 'workflow_dispatch' || vars.XGUARDIAN_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout benchmark
        uses: actions/checkout@v4

      - name: Validate benchmark ground truth
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmark_tools/check_ground_truth.py
          python3 benchmark_tools/check_no_real_secrets.py

      - name: Validate XGuardian configuration
        shell: bash
        env:
          API_EMAIL: ${{ secrets.API_EMAIL }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          XGUARDIAN_TEAM_ID: ${{ vars.XGUARDIAN_TEAM_ID }}
          XGUARDIAN_LANGUAGES: ${{ vars.XGUARDIAN_LANGUAGES }}
        run: |
          set -euo pipefail

          if [[ -z "${API_EMAIL}" ]]; then
            echo "::error::Missing repository secret API_EMAIL"
            exit 1
          fi

          if [[ -z "${API_PASSWORD}" ]]; then
            echo "::error::Missing repository secret API_PASSWORD"
            exit 1
          fi

          if [[ -z "${XGUARDIAN_TEAM_ID}" ]]; then
            echo "::error::Missing repository variable XGUARDIAN_TEAM_ID (JSON array, e.g. [123])"
            exit 1
          fi

          if [[ -z "${XGUARDIAN_LANGUAGES}" ]]; then
            echo "::error::Missing repository variable XGUARDIAN_LANGUAGES (JSON array of XGuardian language names)"
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys

          team_ids = json.loads(os.environ["XGUARDIAN_TEAM_ID"])
          languages = json.loads(os.environ["XGUARDIAN_LANGUAGES"])

          if not isinstance(team_ids, list) or not team_ids or not all(isinstance(v, int) and v > 0 for v in team_ids):
              sys.exit("XGUARDIAN_TEAM_ID must be a non-empty JSON array of positive integer IDs")

          if not isinstance(languages, list) or not languages or not all(isinstance(v, str) and v.strip() for v in languages):
              sys.exit("XGUARDIAN_LANGUAGES must be a non-empty JSON array of strings")
          PY

      - name: Resolve benchmark execution mode
        shell: bash
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.xguardian_environment || 'development' }}
        run: |
          set -euo pipefail
          if [[ "${REQUESTED_ENVIRONMENT}" == "production" ]]; then
            echo "XG_IS_DEVELOPMENT=false" >> "$GITHUB_ENV"
          else
            echo "XG_IS_DEVELOPMENT=true" >> "$GITHUB_ENV"
          fi

      - name: Run XGuardian SAST benchmark
        id: xguardian
        # Pinned to the current xguardian-actions v25.3.0 main HEAD for reproducibility.
        uses: xmart-xguardian/xguardian-actions@8854a4b1ae87beada624979c8dd26d985bdf7957
        with:
          api_email: ${{ secrets.API_EMAIL }}
          api_password: ${{ secrets.API_PASSWORD }}
          app_name: ${{ github.event.repository.name }}
          team_id: ${{ vars.XGUARDIAN_TEAM_ID }}
          languages: ${{ vars.XGUARDIAN_LANGUAGES }}
          description: "Controlled XGuardian SAST accuracy benchmark - intentional vulnerable and benign cases"
          sast: "true"
          sca: "false"
          dast: "false"
          policy_sast: "0"
          scan_directory: "."
          # Keep benchmark tooling/ground-truth out of the SAST target. tsconfig.json is
          # intentionally excluded because JSON is also classified as IaC by the current engine.
          exclude: "benchmark_meta,benchmark_tools,.github,cases/typescript/tsconfig.json"
          translate: "false"
          pdf: "false"
          get_scan_id: "true"
          save_vulns: "true"
          pipeaction: "noAction"
          is_development: ${{ env.XG_IS_DEVELOPMENT }}

      - name: Publish XGuardian scan metadata
        if: success()
        shell: bash
        env:
          APP_ID: ${{ steps.xguardian.outputs.app_id }}
          SCAN_ID: ${{ steps.xguardian.outputs.scan_id }}
          SCAN_URL: ${{ steps.xguardian.outputs.scan_url }}
          SCAN_VERSION: ${{ steps.xguardian.outputs.scan_version }}
        run: |
          {
            echo "## XGuardian SAST Accuracy Benchmark"
            echo
            echo "- App ID: \`${APP_ID}\`"
            echo "- Scan ID: \`${SCAN_ID}\`"
            echo "- Scan version: \`${SCAN_VERSION}\`"
            echo "- Results: ${SCAN_URL}"
            echo "- Ground truth: \`benchmark_meta/ground_truth.json\`"
            echo
            echo "After the scan result is exported as JSON, calculate TP/FP/FN/TN with:"
            echo
            echo '\`\`\`bash'
            echo 'python3 benchmark_tools/evaluate_xguardian.py result.json --output-dir benchmark_score'
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
