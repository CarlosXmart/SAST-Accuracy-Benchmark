name: XGuardian SAST Accuracy Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cases/**"
      - "benchmark_meta/ground_truth.full.json.gz"
      - ".github/workflows/xguardian-sast.yml"

permissions:
  contents: read

concurrency:
  group: xguardian-sast-accuracy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sast-accuracy-scan:
    # Push execution is opt-in to avoid accidental scan consumption before repository setup.
    if: github.event_name == 'workflow_dispatch' || vars.XGUARDIAN_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout benchmark
        uses: actions/checkout@v4

      - name: Validate benchmark ground truth
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmark_tools/check_ground_truth.py
          python3 benchmark_tools/check_no_real_secrets.py

      - name: Validate XGuardian configuration
        shell: bash
        env:
          XGUARDIAN_TOKEN: ${{ secrets.XGUARDIAN_TOKEN }}
          XGUARDIAN_APP_ID: ${{ vars.XGUARDIAN_APP_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${XGUARDIAN_TOKEN}" ]]; then
            echo "::error::Missing repository secret XGUARDIAN_TOKEN"
            exit 1
          fi

          if [[ ! "${XGUARDIAN_APP_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::XGUARDIAN_APP_ID must be the positive numeric ID of the dedicated benchmark application"
            exit 1
          fi

      - name: Prepare cases-only scan payload
        shell: bash
        run: |
          set -euo pipefail

          # tsconfig.json exists only for local TypeScript validation and is not a scored benchmark case.
          rm -f cases/typescript/tsconfig.json

          test -d cases
          echo "Only the cases/ directory will be packaged by the XGuardian Action."
          echo "Scored source files: $(find cases -type f ! -name 'go.mod' | wc -l)"

      - name: Run XGuardian SAST benchmark
        id: xguardian
        # Official SAST Action, release v26.6.2 pinned by commit SHA for reproducibility.
        uses: xguardian-actions/actions/sast@6373d9375d3a859f602dcf53b37a3d8326c8a248
        with:
          token: ${{ secrets.XGUARDIAN_TOKEN }}
          app_id: ${{ vars.XGUARDIAN_APP_ID }}
          scan_directory: "cases"
          translate: "true"
          pdf: "true"
          get_scan_id: "true"

      - name: Publish XGuardian scan metadata
        if: success()
        shell: bash
        env:
          APP_ID: ${{ steps.xguardian.outputs.app_id }}
          SCAN_ID: ${{ steps.xguardian.outputs.scan_id }}
          SCAN_URL: ${{ steps.xguardian.outputs.scan_url }}
          SCAN_VERSION: ${{ steps.xguardian.outputs.scan_version }}
        run: |
          {
            echo "## XGuardian SAST Accuracy Benchmark"
            echo
            echo "- App ID: \`${APP_ID}\`"
            echo "- Scan ID: \`${SCAN_ID}\`"
            echo "- Scan version: \`${SCAN_VERSION}\`"
            echo "- Results: ${SCAN_URL}"
            echo "- Scanned directory: \`cases/\` only"
            echo "- Ground truth: \`benchmark_meta/ground_truth.full.json.gz\`"
            echo "- XGuardian Action: \`xguardian-actions/actions/sast@6373d9375d3a859f602dcf53b37a3d8326c8a248\` (v26.6.2)"
            echo
            echo "After exporting the SAST result as JSON, calculate TP/FP/FN/TN with:"
            echo
            echo '\`\`\`bash'
            echo 'python3 benchmark_tools/evaluate_xguardian.py result.json --output-dir benchmark_score'
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
